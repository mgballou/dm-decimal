name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.base.outputs.run }}
    steps:
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          behind=$(gh api "repos/${{ github.repository }}/compare/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" --jq .behind_by)
          if [ "$behind" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::This branch is $behind commits behind ${{ github.base_ref }}. Update it to run CI."; echo "run=false" >> "$GITHUB_OUTPUT"; fi
  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0

      - name: Unit tests
        run: vendor/bin/pest --testsuite=Unit

      - name: Conformance vectors
        run: vendor/bin/pest --testsuite=Conformance

      - name: Differential against break_eternity.js
        run: vendor/bin/pest --testsuite=Differential

      - name: PHPStan (level 9)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress
